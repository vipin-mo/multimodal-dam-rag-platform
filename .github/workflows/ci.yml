name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url "$TORCH_INDEX" torch==2.14.0
          pip install -r requirements/dev.txt
      - name: Unit tests
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url "$TORCH_INDEX" torch==2.14.0
          pip install -r requirements/dev.txt
      - name: Cache embedding and Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-clip-whisper-tiny-v1
      - name: Start Qdrant, Postgres, MinIO
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Integration tests
        run: |
          source scripts/integration-env.sh
          pytest -m integration -v
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: dam-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
